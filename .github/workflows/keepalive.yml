# Évite la mise en pause d'un projet Supabase gratuit (7 jours sans activité).
# Nécessite les secrets SUPABASE_URL et SUPABASE_ANON_KEY dans GitHub.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 6 */3 * *"   # tous les 3 jours, 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.KEEPALIVE_DISABLED != 'true' }}
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets absents : rien à faire."; exit 0; fi
          curl -s -o /dev/null -w "Auth: %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
          curl -s -o /dev/null -w "REST: %{http_code}\n" "$URL/rest/v1/schools?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
